<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Eco Monitoring Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #1f2937;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card h2 {
      margin: 0;
      font-size: 16px;
      color: #6b7280;
    }

    .card p {
      font-size: 26px;
      margin: 10px 0 0;
      font-weight: bold;
      color: #111827;
    }

    .status {
      font-size: 24px;
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 30px;
      font-weight: bold;
    }

    .good { background: #dcfce7; color: #166534; }
    .normal { background: #fef9c3; color: #854d0e; }
    .bad { background: #ffedd5; color: #9a3412; }
    .danger { background: #fee2e2; color: #991b1b; }

    table {
      width: 100%;
      background: white;
      border-collapse: collapse;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: center;
    }

    th {
      background: #1f2937;
      color: white;
    }
  </style>
</head>
<body>

<h1>Система екологічного моніторингу</h1>

<div id="statusBox" class="status">Завантаження даних...</div>

<div class="cards">
  <div class="card">
    <h2>Газ</h2>
    <p id="gas">-</p>
  </div>
  <div class="card">
    <h2>Пил</h2>
    <p id="dust">-</p>
  </div>
  <div class="card">
    <h2>Температура</h2>
    <p id="temp">-</p>
  </div>
  <div class="card">
    <h2>Вологість</h2>
    <p id="hum">-</p>
  </div>
  <div class="card">
    <h2>Індекс</h2>
    <p id="airIndex">-</p>
  </div>
</div>

<table>
  <thead>
    <tr>
      <th>Час</th>
      <th>Газ</th>
      <th>Пил</th>
      <th>Температура</th>
      <th>Вологість</th>
      <th>Індекс</th>
      <th>Стан</th>
    </tr>
  </thead>
  <tbody id="historyTable"></tbody>
</table>

<script>
  const API_URL = "http://127.0.0.1:8000";

  function setStatus(status) {
    const box = document.getElementById("statusBox");
    box.className = "status";

    if (status === "добрий") {
      box.classList.add("good");
    } else if (status === "задовільний") {
      box.classList.add("normal");
    } else if (status === "забруднений") {
      box.classList.add("bad");
    } else {
      box.classList.add("danger");
    }

    box.textContent = "Стан повітря: " + status;
  }

  async function loadLatest() {
    const response = await fetch(API_URL + "/data/latest");
    const data = await response.json();

    if (data.message) {
      document.getElementById("statusBox").textContent = data.message;
      return;
    }

    document.getElementById("gas").textContent = data.gas;
    document.getElementById("dust").textContent = data.dust;
    document.getElementById("temp").textContent = data.temp + " °C";
    document.getElementById("hum").textContent = data.hum + " %";
    document.getElementById("airIndex").textContent = data.air_index;

    setStatus(data.status);
  }

  async function loadHistory() {
    const response = await fetch(API_URL + "/data/history?limit=20");
    const data = await response.json();

    const table = document.getElementById("historyTable");
    table.innerHTML = "";

    data.forEach(item => {
      table.innerHTML += `
        <tr>
          <td>${item.created_at}</td>
          <td>${item.gas}</td>
          <td>${item.dust}</td>
          <td>${item.temp}</td>
          <td>${item.hum}</td>
          <td>${item.air_index}</td>
          <td>${item.status}</td>
        </tr>
      `;
    });
  }

  async function updateDashboard() {
    await loadLatest();
    await loadHistory();
  }

  updateDashboard();
  setInterval(updateDashboard, 3000);
</script>

</body>
</html>
